<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | {{ site.siteDomain }}</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <nav class="nav">
                <a href="/" class="site-title"><strong>{{ site.siteTitle }}</strong>{{ site.siteTitleSuffix }}</a>
                <ul class="nav-list">
                    <li><a href="/about/" class="nav-link">about</a></li>
                    <li><a href="/resume/" class="nav-link">resume</a></li>
                    <li><a href="/blog/" class="nav-link">blog</a></li>
                </ul>
            </nav>
        </header>
        
        <main class="main">
            {{ content | safe }}
        </main>
        
        <footer class="footer">
            <p>&copy; {{ site.currentYear }} {{ site.author }}. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
